<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>给我打电话</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f7fb;
      flex-direction: column;
    }
    a {
      display: inline-block;
      background: #07c160;
      color: white;
      font-size: 1.8rem;
      font-weight: bold;
      text-decoration: none;
      padding: 16px 48px;
      border-radius: 60px;
      box-shadow: 0 8px 20px rgba(7,193,96,0.35);
      transition: background 0.2s;
      letter-spacing: 2px;
    }
    a:active {
      background: #06ad56;
    }
    .number {
      font-size: 2.6rem;
      font-weight: bold;
      margin-bottom: 24px;
      color: #1a1a1a;
    }
    .tip {
      margin-top: 28px;
      color: #6b7280;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="number">📞 175-3813-0695</div>
  <a href="tel:+8617538130695">点击拨打电话</a>
  <div class="tip">如果无法跳转，请手动拨打上方号码</div>
</body>
</html>
